name: Build and push media worker

on:
  push:
    branches: [main]
    paths:
      - index.js
      - package.json
      - Dockerfile
      - .dockerignore
      - test/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test API
        run: npm test

      - name: Check registry configuration
        env:
          ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USER: ${{ secrets.ACR_USERNAME }}
          ACR_PASS: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_SERVER" ] || [ -z "$ACR_USER" ] || [ -z "$ACR_PASS" ]; then
            echo '::error::Configure ACR_LOGIN_SERVER, ACR_USERNAME and ACR_PASSWORD repository secrets.'
            exit 1
          fi

      - name: Sign in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/yt-media-worker:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/yt-media-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
