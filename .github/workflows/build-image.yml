name: Test experimental worker
on:
  push:
    branches: ['experiment/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - name: Build deployable image
        run: docker build -t media-worker-experiment .
      - name: Check container health
        run: |
          docker run -d --name media-worker-ci -e WORKER_SECRET=ci-only-random-placeholder-secret-1234567890 -p 127.0.0.1:8080:8080 media-worker-experiment
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs media-worker-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f media-worker-ci || true
